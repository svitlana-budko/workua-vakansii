name: workua
on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * *"   # щодня 04:15 UTC, за 45 хв до хмарного агента
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright && python -m playwright install-deps chromium
      - run: xvfb-run -a python workua.py
      - run: |
          git config user.name "workua-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/workua.json && git commit -m "work.ua $(date -u +%F)" && git push || echo "без змін"
