name: workua
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Перезібрати, навіть якщо сьогоднішній файл повний"
        type: boolean
        default: false
  schedule:
    # кілька спроб за ніч: Cloudflare інколи блокує прохід, а повний файл потрібен до 05:00 UTC.
    # Якщо сьогоднішній файл уже повний, наступні спроби одразу виходять.
    - cron: "40 1 * * *"
    - cron: "40 2 * * *"
    - cron: "30 3 * * *"
    - cron: "20 4 * * *"
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE: ${{ inputs.force && '--force' || '' }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright && python -m playwright install-deps chromium
      - run: xvfb-run -a python workua.py maryna $FORCE
        continue-on-error: true
      - run: xvfb-run -a python workua.py svitlana $FORCE
        continue-on-error: true
      - run: |
          git config user.name "workua-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/ && git commit -m "work.ua $(date -u +%F)" && git push || echo "без змін"
