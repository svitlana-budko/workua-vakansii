name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -s -o /dev/null -w "curl work.ua %{http_code}\n" -A "Mozilla/5.0" https://www.work.ua/jobs-remote-account+manager/ || true
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python probe.py
